name: Publish

# Publishes to PyPI when a GitHub Release is published, and only then (no push, pull request or manual trigger).
# Authentication is PyPI Trusted Publishing (OIDC): no token or secret is used anywhere. The publisher on pypi.org is
# owner AIDEdgeInc-Lab, repository aei-history-contract, workflow publish.yml, environment pypi.
# The "pypi" environment requires a reviewer's approval before the publish job runs.
# The workflow file that runs is the one in the commit the release's tag points to, so the tag must contain this file.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: The tag names the version in pyproject.toml
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' pyproject.toml | head -n 1)"
          test -n "$version" && test "$TAG" = "v$version" || { echo "::error::release tag $TAG does not match pyproject version $version"; exit 1; }

      - run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify package metadata
        run: twine check dist/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/aei-history-contract
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # Pinned to an immutable commit SHA, not a floating tag: this step is what authenticates to PyPI via OIDC.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
